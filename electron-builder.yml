appId: com.shulianchuangyuan.ifaceforge
productName: IfaceForge
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
directories:
  output: artifacts/desktop
files:
  - dist/app/**
  - dist/cli/**
  - dist/desktop/**
  - dist/protocols/**
  - dist/scanner/**
  - dist/schemas/**
  - dist/storage/**
  - dist/web/**
  - '!dist/**/*.map'
  - src/desktop/preload.cjs
  - LICENSE
  - package.json
win:
  icon: build/icons/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  icon: build/icons/icon.png
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
linux:
  executableName: ifaceforge
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  category: Development
  maintainer: 数链创元（天津）信息技术有限责任公司 <33503476+qq940500529@users.noreply.github.com>
  icon: build/icons
