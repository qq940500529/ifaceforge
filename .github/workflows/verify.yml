name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-node26
            os: windows-latest
            node: 26.13.1
          - id: windows-node24
            os: windows-latest
            node: 24.22.3
          - id: linux-node26
            os: ubuntu-latest
            node: 26.13.1
          - id: macos-node26
            os: macos-15
            node: 26.13.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      IFG_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r fixtures/fastapi/requirements.txt
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run test:e2e

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  desktop:
    name: Package ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
          - id: linux-x64
            os: ubuntu-latest
          - id: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch the desktop runtime
        run: node node_modules/electron/install.js
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb rpm libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - run: npm run package -- --config.electronDist=node_modules/electron/dist
      - name: Build and verify the independent CLI archive
        shell: bash
        env:
          IFG_CLI_OUTPUT: artifacts/desktop
        run: |
          npm run package:cli
          node scripts/check-package.mjs artifacts/desktop/ifaceforge-cli-*.tar.gz
      - name: Test the installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath artifacts/desktop -Filter '*.exe' | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'IfaceForge 验收 installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $env:IFG_DESKTOP_EXE = Join-Path $install 'IfaceForge.exe'
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Get-ChildItem -LiteralPath $install -Filter 'Uninstall*.exe' | Select-Object -First 1
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited $($process.ExitCode)" }
      - name: Test the Linux AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x artifacts/desktop/*.AppImage
          image=$(realpath artifacts/desktop/*.AppImage)
          mkdir -p "$RUNNER_TEMP/ifaceforge-image"
          (cd "$RUNNER_TEMP/ifaceforge-image" && "$image" --appimage-extract >/dev/null)
          export IFG_DESKTOP_EXE="$RUNNER_TEMP/ifaceforge-image/squashfs-root/ifaceforge"
          xvfb-run -a npm run test:desktop
          dpkg-deb --info artifacts/desktop/*.deb
          rpm -qpi artifacts/desktop/*.rpm
      - name: Test the macOS app from DMG
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/ifaceforge-mount"
          install="$RUNNER_TEMP/IfaceForge 验收"
          mkdir -p "$mount" "$install"
          hdiutil attach artifacts/desktop/*.dmg -nobrowse -mountpoint "$mount"
          ditto "$mount/IfaceForge.app" "$install/IfaceForge.app"
          hdiutil detach "$mount"
          export IFG_DESKTOP_EXE="$install/IfaceForge.app/Contents/MacOS/IfaceForge"
          npm run test:desktop
      - name: Generate dependency inventory
        shell: bash
        run: npm sbom --omit=dev --sbom-format cyclonedx > artifacts/desktop/sbom-${{ matrix.id }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ifaceforge-${{ matrix.id }}
          if-no-files-found: error
          path: |
            artifacts/desktop/*.exe
            artifacts/desktop/*.dmg
            artifacts/desktop/*.AppImage
            artifacts/desktop/*.deb
            artifacts/desktop/*.rpm
            artifacts/desktop/ifaceforge-cli-*.tar.gz
            artifacts/desktop/ifaceforge-cli-*.sha256
            artifacts/desktop/sbom-*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-test-${{ matrix.id }}
          path: |
            playwright-desktop-report
            test-results
